<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111e30"><meta name="robots" content="noindex,nofollow"><title>아스트라 월드 EX · 원정의 시대</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:28px;background:radial-gradient(ellipse at 50% 25%,#254454,#0d1729 65%);color:#edf3f3;font-family:system-ui,sans-serif;text-align:center}main{width:min(420px,100%)}.star{color:#e1c38d;font-size:76px;text-shadow:0 0 36px #d4bc7755}h1{font-size:26px;font-weight:500;letter-spacing:2px;margin:20px 0 10px}.edition{color:#ddbe79;font-size:13px;letter-spacing:3px}p{line-height:1.7;color:#b5cbd0;min-height:54px;font-size:14px}progress{width:100%;height:5px;accent-color:#ddbe79;margin:22px 0}button{border:1px solid #bda16c;border-radius:8px;background:#193440;color:#f6e5bd;padding:14px 28px;font:inherit}small{display:block;margin-top:25px;color:#91a9b5;line-height:1.7}button[hidden]{display:none}</style></head><body><main><div class="star">✧</div><div class="edition">원정의 시대 · 0.3</div><h1>아스트라 월드 EX</h1><p id="status" role="status">검은숲 · 10층 던전 · 100층 탑<br>영웅과 적이 살아 움직이는 세계를 엽니다.</p><progress id="progress" value="0" max="32"></progress><button id="retry" hidden>다시 연결하기</button><small>설치·로그인 없이 플레이합니다.<br>이전 시연판 기록은 보존하고 새 저장 공간을 사용합니다.</small></main><script>
'use strict';
const oldFiles=["p0.txt","p1.txt","p2.txt","p3.txt","p4.txt","p5.txt","p6a.txt","p6b.txt","p6c.txt","p6d.txt","p6e.txt","p6f.txt","p7a.txt","p7b.txt","p7c.txt","p7d.txt","p7e.txt"], groups={"campaign.js":["core-0.txt","core-1.txt","core-2.txt","core-3.txt"],"battle-art.js":["art-0.txt","art-1.txt","art-2.txt"],"app.js":["app-0.txt","app-1.txt","app-2.txt","app-3.txt"],"ui.css":["style-0.txt","style-1.txt"],"shell.html":["shell-0.txt"]};
const expected='7d42182b53b5d4012879ab8ed08111c769b9e9dc24a1775d3f9d0be5977a7b22';
const statusText=document.getElementById('status'),progress=document.getElementById('progress'),retry=document.getElementById('retry');
retry.addEventListener('click',()=>location.reload());
(async()=>{
const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),35000);
try{
 if(!('DecompressionStream' in window)||!window.crypto?.subtle)throw Error('최신 크롬 또는 사파리에서 이 HTTPS 링크를 열어 주세요.');
 const names=[...oldFiles,...Object.values(groups).flat().map(n=>'v3/'+n)];
 const records=new Map();let cursor=0;
 async function worker(){while(cursor<names.length){const name=names[cursor++],res=await fetch(name+'?build=0.3.0',{cache:'no-store',signal:controller.signal});if(!res.ok)throw Error('게임 파일을 불러오지 못했습니다. 다시 연결해 주세요.');records.set(name,await res.text());progress.value++;}}
 await Promise.all(Array.from({length:6},worker));
 const hash=async bytes=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),v=>v.toString(16).padStart(2,'0')).join('');
 const encoded=oldFiles.map(n=>records.get(n).trim()).join('');
 if(encoded.length!==74288||!/^[A-Za-z0-9+/=]+$/.test(encoded))throw Error('기반 파일이 불완전합니다. 다시 연결해 주세요.');
 const compressed=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));
 const raw=await new Response(new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
 if(raw.byteLength!==159438||await hash(raw)!=='d70c2177f8eb66c028b521d540e946ed753658a943836b6c20a0f2234611730d')throw Error('기반 파일 검증에 실패했습니다.');
 const doc=new DOMParser().parseFromString(new TextDecoder('utf-8',{fatal:true}).decode(raw),'text/html');
 const legacy=[...doc.querySelectorAll('script')].slice(0,2).map(s=>s.textContent);
 if(legacy.length!==2)throw Error('세계 엔진을 찾지 못했습니다.');
 const join=name=>groups[name].map(n=>records.get('v3/'+n)).join('');
 const scripts=[...legacy,join('campaign.js'),join('battle-art.js'),join('app.js')].map(s=>'<scr'+'ipt>'+s+'</scr'+'ipt>').join('\n');
 const html=join('shell.html').replace('/*CSS*/',()=>join('ui.css')).replace('<!--SCRIPTS-->',()=>scripts);
 statusText.textContent='전투·던전·탑의 연결을 확인하고 있습니다.';
 const bytes=new TextEncoder().encode(html);
 if(bytes.length!==204102||await hash(bytes)!==expected)throw Error('새 게임 파일 검증에 실패했습니다. 다시 연결해 주세요.');
 progress.value=32;clearTimeout(timer);document.open();document.write(html);document.close();
}catch(e){clearTimeout(timer);controller.abort();statusText.textContent=e.name==='AbortError'?'연결이 지연되고 있습니다. 인터넷 연결을 확인하고 다시 시도해 주세요.':e.message||'게임을 열지 못했습니다.';retry.hidden=false;console.error('Astra loader:',e);}
})();
</script></body></html>
